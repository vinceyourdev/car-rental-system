<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover Password - Rent Your Perfect Ride</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fas fa-car"></i> RENT YOUR PERFECT RIDE</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="vehicles.html">Vehicles</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
  </nav>

  <section class="section">
    <div class="form-card" style="max-width: 480px; margin: 0 auto;">
      <h2 style="text-align: center; margin-bottom: 0.5rem;">
        <i class="fas fa-question-circle" style="color: var(--warning);"></i> Forgot Password?
      </h2>
      <p style="text-align: center; color: var(--gray); margin-bottom: 2rem;">No worries — reset it in 3 simple steps</p>
      
      <!-- Step 1: Email -->
      <div id="step-email">
        <div class="form-group">
          <label for="recovery-email"><i class="fas fa-envelope"></i> Your Email</label>
          <input type="email" id="recovery-email" placeholder="Enter your registered email" required>
        </div>
        <button class="btn btn-primary btn-full" onclick="findAccount()">
          <i class="fas fa-search"></i> Find My Account
        </button>
        <p style="text-align: center; margin-top: 1.5rem;">
          <a href="login.html" style="color: var(--primary);">← Back to Login</a>
        </p>
      </div>

      <!-- Step 2: Security Question -->
      <div id="step-question" style="display: none;">
        <div class="form-group">
          <label><i class="fas fa-shield-alt"></i> Your Security Question</label>
          <p style="font-weight: 600; padding: 0.8rem; background: #f3f4f6; border-radius: 8px;" id="q-display"></p>
        </div>
        <div class="form-group">
          <label for="answer-input"><i class="fas fa-key"></i> Your Answer</label>
          <input type="text" id="answer-input" placeholder="Enter your answer" required>
        </div>
        <button class="btn btn-primary btn-full" onclick="verifyAnswer()">
          <i class="fas fa-check-circle"></i> Verify
        </button>
        <p style="text-align: center; margin-top: 1rem;">
          <a href="#" onclick="goBack(); return false;" style="color: var(--primary);">← Change Email</a>
        </p>
      </div>

      <!-- Step 3: New Password -->
      <div id="step-reset" style="display: none;">
        <div style="text-align: center; margin-bottom: 1.5rem; color: var(--success);">
          <i class="fas fa-unlock fa-3x"></i>
          <p style="font-weight: 600; margin-top: 0.5rem;">Verified! Create new password</p>
        </div>
        <div class="form-group">
          <label for="new-pass"><i class="fas fa-lock"></i> New Password</label>
          <input type="password" id="new-pass" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm-new-pass"><i class="fas fa-lock"></i> Confirm New Password</label>
          <input type="password" id="confirm-new-pass" placeholder="Re-enter new password" required>
        </div>
        <button class="btn btn-primary btn-full" onclick="saveNewPassword()">
          <i class="fas fa-save"></i> Update Password
        </button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Rent Your Perfect Ride. All Rights Reserved.</p>
  </footer>

  <script>
    let userData = null;

    function showStep(stepName) {
      document.getElementById('step-email').style.display = 'none';
      document.getElementById('step-question').style.display = 'none';
      document.getElementById('step-reset').style.display = 'none';
      document.getElementById(`step-${stepName}`).style.display = 'block';
    }

    function findAccount() {
      const email = document.getElementById('recovery-email').value.trim();
      const saved = localStorage.getItem('userData');
      
      if (!saved) {
        alert('❌ No account found. Please sign up first.');
        return;
      }
      
      userData = JSON.parse(saved);
      
      if (userData.email !== email) {
        alert('❌ Email not found. Please check and try again.');
        return;
      }
      
      document.getElementById('q-display').textContent = userData.recoveryQuestion;
      showStep('question');
    }

    function verifyAnswer() {
      const input = document.getElementById('answer-input').value.trim().toLowerCase();
      
      if (input === userData.recoveryAnswer) {
        showStep('reset');
      } else {
        alert('❌ Incorrect answer. Try again.');
        document.getElementById('answer-input').value = '';
      }
    }

    function saveNewPassword() {
      const pass1 = document.getElementById('new-pass').value;
      const pass2 = document.getElementById('confirm-new-pass').value;
      
      if (pass1 !== pass2) {
        alert('❌ Passwords do not match!');
        return;
      }
      
      if (pass1.length < 6) {
        alert('❌ Password must be at least 6 characters.');
        return;
      }
      
      userData.password = pass1;
      localStorage.setItem('userData', JSON.stringify(userData));
      
      alert('✅ Password updated successfully!\n\nYou can now login with your new password.');
      window.location.href = 'login.html';
    }

    function goBack() {
      userData = null;
      showStep('email');
    }
  </script>
</body>
</html>
